<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KASKU</title>

<link rel="stylesheet" href="style.css">

<!-- manifest PWA -->
<link rel="manifest" href="manifest.json">

<!-- icon browser -->
<link rel="icon" href="icon-192.png">

<!-- warna theme -->
<meta name="theme-color" content="#2c7be5">

</head>

<body>

<h1>KASKU - Aplikasi Kas</h1>

<div id="tanggal"></div>

<h3>Input Data</h3>

<input id="keterangan" placeholder="Keterangan">

<input id="masuk" type="number" placeholder="Kas Masuk">

<input id="keluar" type="number" placeholder="Kas Keluar">

<button onclick="tambahData()">Simpan</button>

<h3>Data Kas</h3>

<table border="1">

<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tabelData"></tbody>

</table>

<script src="app.js"></script>

<script>

if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('service-worker.js');
}

</script>

</body>
</html>
