<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KASKU</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="img_iconkas.png">

<meta name="theme-color" content="#2c7be5">

<!-- iOS support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="img_iconkas.png">

</head>

<body>

<h1>KASKU - Aplikasi Kas</h1>

<div id="tanggal"></div>

<h2 id="saldoCard">Saldo : Rp 0</h2>

<h3>Input Data</h3>

<input id="tanggalInput" type="date">

<input id="keterangan" type="text" placeholder="Keterangan">

<input id="masuk" type="text" placeholder="Kas Masuk (Rp)" onkeyup="formatRupiah(this)">

<input id="keluar" type="text" placeholder="Kas Keluar (Rp)" onkeyup="formatRupiah(this)">

<button onclick="tambahData()">Simpan</button>

<h3>Data Kas</h3>

<table>

<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tabelData"></tbody>

</table>

<script src="app.js"></script>

<script>

function formatRupiah(input){

let angka = input.value.replace(/[^0-9]/g,'');

let number_string = angka.toString();
let sisa = number_string.length % 3;
let rupiah = number_string.substr(0, sisa);
let ribuan = number_string.substr(sisa).match(/\d{3}/g);

if(ribuan){
let separator = sisa ? '.' : '';
rupiah += separator + ribuan.join('.');
}

input.value = rupiah ? "Rp " + rupiah : "";

}

</script>

<script>
if ('serviceWorker' in navigator) {
window.addEventListener('load', function(){
navigator.serviceWorker.register('service-worker.js');
});
}
</script>

</body>
</html>
