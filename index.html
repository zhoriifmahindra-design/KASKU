<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KASKU</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="img_iconkas.png">

<meta name="theme-color" content="#2c7be5">

<!-- iOS support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="img_iconkas.png">

</head>

<body>

<h1>KASKU - Aplikasi Kas</h1>

<div id="tanggal"></div>

<h3>Input Data</h3>

<input id="keterangan" type="text" placeholder="Keterangan">
<input id="masuk" type="number" placeholder="Kas Masuk">
<input id="keluar" type="number" placeholder="Kas Keluar">

<button onclick="tambahData()">Simpan</button>

<h3>Data Kas</h3>

<table>

<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tabelData"></tbody>

</table>

<script src="app.js"></script>

<script>
if ('serviceWorker' in navigator) {
window.addEventListener('load', function(){
navigator.serviceWorker.register('service-worker.js');
});
}
</script>

</body>
</html>
